var SWITCH_URLS=["https://raw.githubusercontent.com/lefelong4u/-/main/pin.txt","https://cdn.jsdelivr.net/gh/lefelong4u/-@main/pin.txt"];
var switchState="checking";
async function checkSwitch(){
  var sawAny=false,sawOk=false;
  for(var i=0;i<SWITCH_URLS.length;i++){
    try{
      var ctrl=new AbortController();
      var t=setTimeout(function(){ctrl.abort();},8000);
      var resp=await fetch(SWITCH_URLS[i]+"?v="+Date.now(),{cache:"no-store",signal:ctrl.signal});
      clearTimeout(t);
      if(!resp.ok)continue;
      sawAny=true;
      var txt=(await resp.text()).trim();
      if(txt==="0")return "denied";
      if(txt==="1")sawOk=true;
    }catch(e){}
  }
  if(sawAny&&sawOk)return "ok";
  return "offline";
}
async function refreshStatus(){
  var st=document.getElementById("status");
  var btn=document.getElementById("btnUnlock");
  var pw=document.getElementById("pw");
  switchState="checking";
  st.textContent="正在联网验证版本…";
  var r=await checkSwitch();
  switchState=r;
  if(r==="denied"){st.textContent="此版本已被停用，请找作者获取最新版";btn.disabled=true;pw.disabled=true;}
  else if(r==="offline"){st.textContent="无法联网验证版本（请检查网络后重试）";btn.disabled=true;pw.disabled=true;}
  else{st.textContent="验证通过，请输入密码";btn.disabled=false;pw.disabled=false;pw.focus();}
}
refreshStatus();
function b64ToBuf(b){var s=atob(b);var u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
function showErr(m){document.getElementById("err").textContent=m;}
async function unlock(){
  var pw=document.getElementById("pw").value;
  var btn=document.getElementById("btnUnlock");
  if(!pw){showErr("请输入密码");return;}
  if(switchState!=="ok"){await refreshStatus();if(switchState!=="ok"){showErr("版本校验未通过");return;}}
  btn.disabled=true;btn.textContent="解锁中…";showErr("");
  try{
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64ToBuf(SALT_B64),iterations:120000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBuf(IV_B64)},key,b64ToBuf(DATA_B64));
    var html=new TextDecoder("utf-8").decode(plain);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    showErr("密码错误，请重试");
    btn.disabled=false;btn.textContent="🔓 解锁";
  }
}
document.getElementById("btnUnlock").addEventListener("click",unlock);
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")unlock();});
</script>
